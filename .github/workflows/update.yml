name: Update golf data

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-golf-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade garminconnect curl_cffi

      - name: Fetch rounds from Garmin
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
        run: python fetch_golf.py

      - name: Commit changes
        run: |
          git config user.name "golf-bot"
          git config user.email "golf-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update golf data"
            git push
          fi
